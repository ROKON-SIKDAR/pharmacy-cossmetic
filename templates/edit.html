
{% extends "index.html" %}



{% block content %}




<div class="form-container">

    <h2>Update Product Medicin</h2>
    
    {% if messages %}
    {% for message in messages %}
        <div class="message">{{ message }}</div>
    {% endfor %}
    {% endif %}


    <div class="listproduct"><a href="{% url 'listproduct' %}">List Product</a></div>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- Product Name -->
        <div class="form-group">
            <label>Product Name</label>
            <input type="text" name="name" placeholder="Enter product name" value="{{ product.name }}">
        </div>

        <!-- Location -->
        <div class="form-group">
            <label>Location</label>
            <input type="text" name="location" value="{{ product.location }}">
        </div>

        <!-- Product Date -->
        <div class="form-group">
            <label>Product Date</label>
            <input type="date" name="date" value="{{ product.date|date:'Y-m-d' }}">
        </div>

        <!-- Expired Date -->
        <div class="form-group">
            <label>Expired Date</label>
            <input type="date" name="expired" value="{{ product.expired|date:'Y-m-d' }}">
        </div>

        <!-- Quantity -->
        <div class="form-group">
            <label>Quantity</label>
            <input type="number" name="quantity" min="0" placeholder="Enter quantity" value="{{ product.quantity }}">
        </div>

        <!-- Price -->
        <div class="form-group">
            <label>Price</label>
            <input type="number" name="price" step="0.01" min="0" placeholder="Enter price" value="{{ product.price }}">
        </div>

        <!-- Update Price -->
        <div class="form-group">
            <label>Discount Price</label>
            <input type="number" name="discount" step="0.01" min="0" placeholder="Discount price" value="{{ product.discount }}">
        </div>

        

        <!-- Image -->
        <div class="form-group">
            <label>Product Image</label>
            <input type="file" name="image" accept="image/*" value="{{ product.image }}">
        </div>

        <button type="submit">Update Product</button>

    </form>

</div>



{% endblock %}
